# VocalRender SVS data-preprocessing configuration
# ----------------------------------------------------------------
# Offline preprocessing: decodes audio, encodes it with VoxCPM2's
# AudioVAE V2 (16 kHz input, asymmetric encoder/decoder), and writes
# Arrow shards consumed by scripts/train_vocalrender_svs.py.
#
# Usage:
#   python scripts/preprocess_svs_data.py conf/svs_preprocess.yaml

# ================================================================
# Datasets
# ================================================================
# Two loader types are supported:
#
# 1. json_file — a JSON array with one annotation object per audio segment:
#      [
#        {
#          "item_name": "Alto-1#newboy#0000",
#          "wav_fn":    "Alto-1#newboy/0000.wav",
#          "word":       ["AP", "感", "受", ..., "SP"],   # lyric per word slot (AP/SP = breath/silence)
#          "word_dur":   [0.14, 0.31, ...],               # optional; visualization/evaluation only, aligned with `word`
#          "pitch":      [0, 62, 62, 60, ...],            # MIDI pitch per note segment (0 = rest)
#          "note":       ["<NOTE_8>", "<NOTE_DOT_16>", ...],  # note-duration token per segment
#          "pitch_dur":  [0.14, 0.31, ...],               # optional; visualization/evaluation only, seconds per note segment
#          "pitch2word": [0, 1, 1, 2, ...],               # note segment -> word index
#          "bpm":        90
#        }
#        ...
#      ]
#    Audio is read from <audio_root>/<wav_fn>.
#    song_id_indices / song_id_slice / song_id_separator derive a song_name
#    from item_name so that train/val prompt clips stay within one song.
#
# 2. folder_based — one folder per song, each containing segment audio
#    files plus a metadata.json aggregating the same annotation fields.

datasets:
  # CrawlSinger-OS: https://huggingface.co/datasets/pymaster/CrawlSinger-OS
  # Download and extract the TAR shards as described in README.md so this
  # directory contains muse/, muchin/, songformdb/, opensinger/, m4singer/,
  # gtsinger/, and opencpop/.
  - name: muse
    type: folder_based
    dataset_root: data/CrawlSinger-OS/muse

  - name: muchin
    type: folder_based
    dataset_root: data/CrawlSinger-OS/muchin

  - name: songformdb
    type: folder_based
    dataset_root: data/CrawlSinger-OS/songformdb

  - name: opensinger
    type: json_file
    json_path: data/CrawlSinger-OS/opensinger/annotations.json
    audio_root: data/CrawlSinger-OS/opensinger/audio
    song_id_indices: [0, 1]
    song_id_separator: "#"

  - name: m4singer
    type: json_file
    json_path: data/CrawlSinger-OS/m4singer/annotations.json
    audio_root: data/CrawlSinger-OS/m4singer/audio
    song_id_indices: [0, 1]

  - name: gtsinger
    type: json_file
    json_path: data/CrawlSinger-OS/gtsinger/annotations.json
    audio_root: data/CrawlSinger-OS/gtsinger/audio
    song_id_indices: [1, 3]

  # Held out by conf/svs_train.yaml for validation.
  - name: opencpop
    type: json_file
    json_path: data/CrawlSinger-OS/opencpop/annotations.json
    audio_root: data/CrawlSinger-OS/opencpop/audio
    song_id_slice: [0, 4]

# Pre-trained model path (VoxCPM2, for AudioVAE V2 and tokenizer)
pretrained_path: pretrained_models/VoxCPM2

# Output directory for preprocessed Arrow shards. Prefer fast local disk;
# a run that both reads audio and writes Arrow over NFS becomes I/O-bound.
output_dir: data/preprocessed

# Maximum number of samples to process (-1 for all)
max_samples: -1

# Target audio sample rate for VAE encoding (MUST be 16000 for VoxCPM2;
# the decoder outputs 48000 Hz at training/inference time).
sample_rate: 16000

# Device for VAE encoding
device: cuda

# Number of parallel workers for data loading (audio decode + resample).
# In multi-GPU mode this is split per rank (num_workers // num_gpus).
num_workers: 32

# Number of samples per Arrow shard
shard_size: 50000

# Max samples per VAE encode batch
vae_batch_size: 32

# Max total waveform samples per VAE batch (~100 s of 16 kHz audio)
vae_max_tokens: 1600000

# Number of GPUs for parallel VAE encoding (-1 = all visible)
num_gpus: -1

# Multi-GPU dispatch is dynamic: the parent feeds duration-homogeneous chunks
# of this many samples into a shared work queue and each GPU pulls chunks on
# demand. Smaller = finer load-balancing but more queue traffic.
dispatch_chunk_size: 2000
