name: Deploy project page

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "assets/**"
      - "storm-reports/vocalrender-suno-quality-roadmap/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          cp -R assets _site/assets
          mkdir -p _site/storm-reports
          cp -R storm-reports/vocalrender-suno-quality-roadmap _site/storm-reports/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
